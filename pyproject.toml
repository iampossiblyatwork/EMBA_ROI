[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emba-roi"
version = "2.0.0"
description = "Michigan State Executive MBA ROI calculator (Flask + React)"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4.0",
    "gunicorn>=21.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]
